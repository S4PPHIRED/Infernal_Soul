name: DISCORD_ROADMAP_UPDATE

on:
  push:
    paths:
      - "RoadMap.md"

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Roadmap to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ROADMAP_UPDATE }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          roadmap = open("RoadMap.md", encoding="utf-8").read()

          data = {
              "embeds": [{
                  "title": "🎮 Roadmap Updated",
                  "description": roadmap[:4000],
                  "footer": {
                      "text": "Automatically updated from GitHub"
                  }
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(data).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          urllib.request.urlopen(request)
          PY
