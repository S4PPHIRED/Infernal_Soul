name: Discord Update

on:
  push:
    paths:
      - "RoadMap.md"

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Send RoadMap to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_ROADMAP_UPDATE }}
        run: |
          # Discord acepta máximo 2000 caracteres por mensaje
          HEADER="# ** TRIVIA **"$'\n\n'
          BODY=$(head -c 1900 RoadMap.md)
          jq -n --arg c "$HEADER$BODY" '{content: $c}' > /tmp/payload.json

          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json "$WEBHOOK"
