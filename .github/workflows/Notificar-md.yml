name: GAME STATUS a Discord

on:
  push:
    paths:
      - 'game_status.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-game-status
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar mensaje nuevo
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f game_status.md ]; then
            echo "No existe game_status.md"
            exit 1
          fi

          jq -Rs --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            embeds: [{
              author: { name: "🗺️ Roadmap del proyecto" },
              title: "🎮 GAME STATUS",
              description: .[0:4000],
              color: 5793266,
              footer: { text: "Actualización publicada desde GitHub" },
              timestamp: $ts
            }]
          }' game_status.md > /tmp/payload.json

          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json "$WEBHOOK")

          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
            echo "Error al enviar a Discord: HTTP $CODE"
            exit 1
          fi
          echo "Anuncio publicado"
