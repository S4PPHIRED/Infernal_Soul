name: GAME STATUS a Discord

on:
  push:
    paths:
      - 'game_status.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-game-status
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Editar mensaje de GAME STATUS
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG_ID: "1557643892520648806"
        run: |
          if [ ! -f game_status.md ]; then
            echo "No existe game_status.md"
            exit 1
          fi

          jq -Rs --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            embeds: [{
              author: { name: "🗺️ Roadmap del proyecto" },
              title: "🎮 GAME STATUS",
              description: .[0:4000],
              color: 5793266,
              footer: { text: "Actualización publicada desde GitHub" },
              timestamp: $ts
            }]
          }' game_status.md > /tmp/payload.json

          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "$WEBHOOK/messages/$MSG_ID")

          echo "PATCH HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Error al editar el mensaje (HTTP $CODE)"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Mensaje editado correctamente"
