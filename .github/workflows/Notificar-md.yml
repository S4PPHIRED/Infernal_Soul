name: GAME STATUS a Discord

on:
  push:
    paths:
      - 'game_status.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-game-status
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Editar o crear mensaje en Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e
          ID_FILE="discord_message_id.txt"

          if [ ! -f game_status.md ]; then
            echo "No existe game_status.md"
            exit 1
          fi

          jq -Rs --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            embeds: [{
              author: { name: "🗺️ Roadmap del proyecto" },
              title: "🎮 GAME STATUS",
              description: .[0:4000],
              color: 5793266,
              footer: { text: "Actualización publicada desde GitHub" },
              timestamp: $ts
            }]
          }' game_status.md > /tmp/payload.json

          MSG_ID=""
          if [ -f "$ID_FILE" ]; then
            MSG_ID=$(grep -oE '[0-9]{17,20}' "$ID_FILE" | head -n1 || true)
          fi

          CODE=""
          if [ -n "$MSG_ID" ]; then
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json \
              "$WEBHOOK/messages/$MSG_ID")
            echo "PATCH HTTP $CODE"
          fi

          if [ "$CODE" = "200" ]; then
            echo "Mensaje editado: $MSG_ID"
          else
            # No hay ID, o el mensaje fue borrado (404): crear uno nuevo
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json \
              "$WEBHOOK?wait=true")
            echo "POST HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "Error al crear mensaje"
              cat /tmp/resp.json
              exit 1
            fi
            NEW_ID=$(jq -r '.id' /tmp/resp.json)
            echo "$NEW_ID" > "$ID_FILE"
            echo "Mensaje nuevo creado: $NEW_ID"
          fi

      - name: Guardar ID en el repo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discord_message_id.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar ID del mensaje de Discord"
            git push
          fi
